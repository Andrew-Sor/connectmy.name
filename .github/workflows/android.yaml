name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'               # запуск при пуше тегов вида v1.0.0
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write           # нужно для создания релизов

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.jks
        chmod 600 ${{ github.workspace }}/keystore.jks

    - name: Build with Gradle
      run: |
        export KEYSTORE_PATH="${{ github.workspace }}/keystore.jks"
        export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
        export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
        export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
        ./gradlew assembleRelease

    - name: Upload APK as artifact (always)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release and attach APK
      if: startsWith(github.ref, 'refs/tags/v')   # только для тегов
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}